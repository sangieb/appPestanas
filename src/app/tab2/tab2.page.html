<ion-header>
  <ion-toolbar class="degradado">
    <ion-title>Contador</ion-title>
  </ion-toolbar>
</ion-header>

<ion-content class="ion-padding">
  <div class="contenedor">
    <p class="subtitulo">Toca los botones para contar</p>

    <div class="circulo">
      <span>{{ contador }}</span>
    </div>

    <div class="botones">
      <ion-button color="danger" (click)="decrease()" [disabled]="contador === 0">
        <ion-icon name="remove" slot="icon-only"></ion-icon>
      </ion-button>
      <ion-button color="success" (click)="increase()">
        <ion-icon name="add" slot="icon-only"></ion-icon>
      </ion-button>
    </div>

    @if (contador === 0) {
      <p class="aviso">El contador no puede bajar de cero</p>
    }
  </div>
</ion-content>
